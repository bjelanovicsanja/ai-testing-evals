# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Juice Shop support assistant

# The question is passed to the app as it is; the system prompt lives in the app code.
prompts:
  - '{{question}}'

providers:
  - file://providers/supportAssistantProvider.ts

defaultTest:
  assert:
    - type: javascript
      value: output.length <= 600
      metric: short-answer

tests: file://tests/support-assistant.yaml
