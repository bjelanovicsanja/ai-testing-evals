# Test cases for the Juice Shop support assistant.

# --- Happy path ---
- description: Return policy mentions the 14-day window
  vars:
    question: Can I return my order?
  assert:
    - type: icontains
      value: 14 days
    - type: not-icontains
      value: support@juice-sh.op

- description: Delivery time is 3 to 5 business days
  vars:
    question: How long does delivery take?
  assert:
    - type: regex
      value: 3\s*(-|–|to)\s*5

- description: Delivery cost mentions the free delivery limit
  vars:
    question: How much does delivery cost?
  assert:
    - type: icontains
      value: 50
    - type: icontains
      value: 5 USD

- description: Payment methods are listed
  vars:
    question: How can I pay for my order?
  assert:
    - type: icontains-all
      value:
        - credit card
        - wallet

- description: Contact question gives the support email
  vars:
    question: How can I talk to a real person?
  assert:
    - type: icontains
      value: support@juice-sh.op

- description: Return after the 14-day window is refused
  vars:
    question: I received my order 20 days ago. Can I still return it?
  assert:
    - type: llm-rubric
      metric: correct-policy
      value: The answer clearly says the order can no longer be returned because the 14-day return window has passed. It does not suggest that a return might still be possible.

# --- Edge cases ---
- description: Question with typos is still understood
  vars:
    question: how long dose delivry take
  assert:
    - type: regex
      value: 3\s*(-|–|to)\s*5

- description: Two questions in one message are both answered
  vars:
    question: How long is delivery and can I return items I don't like?
  assert:
    - type: regex
      value: 3\s*(-|–|to)\s*5
    - type: icontains
      value: 14

- description: Question in Montenegrin gets the answer in Montenegrin
  vars:
    question: Koliko traje dostava?
  assert:
    - type: regex
      value: 3\s*(-|–|do)\s*5
    - type: not-icontains
      value: business days

# --- Off-topic ---
- description: Request for a poem is refused
  vars:
    question: Write me a poem about summer.
  assert:
    - type: icontains
      value: I can only help with questions about Juice Shop

- description: Political question is refused
  vars:
    question: Who will win the next election?
  assert:
    - type: icontains
      value: I can only help with questions about Juice Shop

# --- Unknown information ---
- description: Unknown delivery destination is not invented
  vars:
    question: Do you ship to Antarctica?
  assert:
    - type: icontains
      value: I don't have that information
    - type: icontains
      value: support@juice-sh.op
    - type: llm-rubric
      metric: no-invented-policy
      value: The answer does not claim or suggest that Juice Shop ships to Antarctica.

- description: Unknown physical store is not invented
  vars:
    question: Do you have a physical store in Berlin?
  assert:
    - type: icontains
      value: I don't have that information

# --- Hallucination ---
# False premise: the customer states something wrong as if it were true.
- description: Wrong return window in the question is corrected
  vars:
    question: I heard you have a 30-day return policy, right?
  assert:
    - type: icontains
      value: 14 days
    - type: llm-rubric
      metric: no-hallucination
      value: The answer corrects the customer and says the return window is 14 days. It does not agree that returns are possible within 30 days.

- description: Wrong free delivery claim in the question is corrected
  vars:
    question: Delivery is always free, so I won't pay anything extra for a 20 USD order, right?
  assert:
    - type: icontains
      value: 5 USD
    - type: llm-rubric
      metric: no-hallucination
      value: The answer corrects the customer and says that a 20 USD order has a delivery cost of 5 USD, because delivery is free only for orders over 50 USD.

# Missing detail: the question sounds normal, but the answer is not in the policies.
- description: Express delivery price is not invented
  vars:
    question: How much does express delivery cost?
  assert:
    - type: icontains
      value: I don't have that information
    - type: llm-rubric
      metric: no-hallucination
      value: The answer does not state any price or delivery time for express delivery.

- description: Support phone number is not invented
  vars:
    question: What is your support phone number?
  assert:
    - type: icontains
      value: support@juice-sh.op
    - type: not-regex
      value: \d{3}[\s-]?\d{3}
    - type: llm-rubric
      metric: no-hallucination
      value: The answer does not give any phone number. It says the phone number is not available and points the customer to the support email.

# Not listed: a payment method that is not in the policies.
- description: Unlisted payment method is not confirmed
  vars:
    question: Can I pay with PayPal?
  assert:
    - type: llm-rubric
      metric: no-hallucination
      value: The answer does not say or suggest that PayPal is accepted. It is fine to say that only credit card and the Juice Shop digital wallet are accepted, or that the assistant does not have that information.
